# wkm-owner-id: wechat-memory-license
# 可选 existing TLS 入口；须先通过客户端 HTTPS origin 兼容门禁，且不占用 80/ACME。
server {
    listen 9000 ssl;
    listen [::]:9000 ssl;
    server_name 104.244.90.172;

    ssl_certificate     /etc/letsencrypt/live/104.244.90.172/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/104.244.90.172/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WKM_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 64k;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    access_log /var/log/nginx/wechat-memory-license.access.log;
    error_log  /var/log/nginx/wechat-memory-license.error.log warn;

    location = /readyz/deep {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 9000;
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_hide_header X-Powered-By;
    }
}
