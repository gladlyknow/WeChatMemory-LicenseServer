# wkm-owner-id: wechat-memory-license
# 第一次签发证书前使用。本文件应复制为：
# /etc/nginx/conf.d/wechat-memory-license.conf
server {
    listen 80;
    listen [::]:80;
    server_name 104.244.90.172;

    access_log /var/log/nginx/wechat-memory-license-acme.access.log;
    error_log  /var/log/nginx/wechat-memory-license-acme.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/wechat-memory-license-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
