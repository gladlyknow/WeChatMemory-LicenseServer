# wkm-owner-id: wechat-memory-license
# 默认生产入口：纯 HTTP 9000。应用仍只监听 127.0.0.1:9100。
server {
    listen 9000;
    listen [::]:9000;
    server_name 104.244.90.172;

    client_max_body_size 64k;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    access_log /var/log/nginx/wechat-memory-license.access.log;
    error_log  /var/log/nginx/wechat-memory-license.error.log warn;

    # 完整性检查只允许部署器从 127.0.0.1:9100 直接访问。
    location = /readyz/deep {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        # 服务只有这一层可信反向代理；覆盖而非追加，避免客户端伪造限流来源。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Port 9000;
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_hide_header X-Powered-By;
    }
}
